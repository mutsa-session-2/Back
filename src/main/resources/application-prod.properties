# Production profile defaults
# 운영에서는 Swagger/OpenAPI 문서를 외부에 노출하지 않는 것을 권장합니다.
# 필요 시 환경변수로만 임시 활성화하세요.
# - SPRINGDOC_SWAGGER_UI_ENABLED=true
# - SPRINGDOC_API_DOCS_ENABLED=true
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:false}
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:false}

# Optional: reduce noisy security logs in prod
logging.level.org.springframework.security=INFO
