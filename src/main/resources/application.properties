# ===============================
# 서버 설정
# ===============================
spring.config.import=optional:file:.env[.properties]
spring.application.name=floorida
# Cloud(PaaS) 환경에서 제공하는 PORT 값을 우선 사용
server.port=${PORT:8080}

# ===============================
# DB 설정 (PostgreSQL - Supabase)
# ===============================
spring.datasource.driver-class-name=org.postgresql.Driver
# Supabase PostgreSQL 연결
# Prefer standard SPRING_DATASOURCE_* variables if present, fallback to DB_* from .env
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}

# ===============================
# JPA 설정
# ===============================
# 개발/운영 공통: 스키마는 유지하고 변경만 반영
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# OSIV(Open Session In View)로 인해 요청 동안 커넥션이 오래 점유되는 것을 방지
spring.jpa.open-in-view=false

# ===============================
# Connection Pool (Supabase/PgBouncer friendly)
# ===============================
# Supabase Session pool은 동시 연결이 빡빡해서, 로컬 개발에서도 풀 사이즈를 작게 유지
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:1}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=300000
# Transaction pooler(PgBouncer) 사용 시 prepared statement로 인한 이슈 방지
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# ===============================
# JWT 설정
# ===============================
jwt.secret=${JWT_SECRET:your_jwt_secret_key_here}
# 만료시간(ms). 주석은 값과 같은 줄에 쓰지 마세요.
jwt.expiration=3600000

# ===============================
# AWS S3 설정 (캐릭터 이미지)
# ===============================
aws.s3.access-key=${AWS_S3_ACCESS_KEY}
aws.s3.secret-key=${AWS_S3_SECRET_KEY}
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME}
aws.s3.region=${AWS_S3_REGION}

# ===============================
# 로깅
# ===============================
logging.level.org.springframework.security=DEBUG

# ===============================
# Email (SMTP) 설정 (Gmail App Password 권장)
# ===============================
# 이메일 발송을 끄고 싶으면 false
app.email.enabled=${APP_EMAIL_ENABLED:true}
# 인증 메일 발신자(From)
app.email.from=${APP_EMAIL_FROM:}
# 외부에서 접근 가능한 베이스 URL (인증 링크 생성에 사용)
app.base-url=${APP_BASE_URL:http://localhost:8080}

spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# Health (sensitive endpoints)
# ===============================
# /api/health/email/send-test 호출 시 X-Health-Token 값으로 검증합니다.
app.health.token=${APP_HEALTH_TOKEN:}

# ===============================
# Swagger (Basic Auth)
# ===============================
# Swagger/OpenAPI는 공개하지 않습니다. 브라우저 접근 시 Basic Auth가 필요합니다.
# 운영에서는 아래 값을 반드시 환경변수(.env)로 변경하세요.
app.swagger.basic.username=${APP_SWAGGER_BASIC_USERNAME:swagger}
app.swagger.basic.password=${APP_SWAGGER_BASIC_PASSWORD:change-me}

# BasicAuth는 브라우저가 (origin + realm) 단위로 자격증명을 캐시합니다.
# 아래 suffix 값을 변경하면 브라우저가 다시 로그인 프롬프트를 띄우게 할 수 있습니다.
app.swagger.basic.realmSuffix=${APP_SWAGGER_BASIC_REALM_SUFFIX:}

# ===============================
# Test User Seeder (disabled by default)
# ===============================
app.seed.test-user.enabled=false
app.seed.test-user.email=test1000@floorida.local
app.seed.test-user.username=test1000
app.seed.test-user.password=test1234!
app.seed.test-user.points=1000

# ===============================
# CORS Configuration
# ===============================
app.cors.allowed-origins=http://localhost:5173
